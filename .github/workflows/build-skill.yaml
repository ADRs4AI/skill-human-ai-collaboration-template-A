name: Build and Release Skill

# ─────────────────────────────────────────────────────────────────
# Triggers:
#   push main       → validate + build artifact (30-day retention)
#   pull_request    → validate only
#   push v*.*.* tag → validate + build + GitHub Release
#   workflow_dispatch → validate + build artifact on demand
# ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow release job to create GitHub Releases and upload assets
permissions:
  contents: write

# Cancel in-progress runs for the same branch/PR (not for tags — let releases finish)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:

  # ──────────────────────────────────────────────────────────────
  # JOB 1: validate
  # Validates skill structure, frontmatter, and file requirements
  # ──────────────────────────────────────────────────────────────
  validate:
    name: Validate skill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Check required files exist ──────────────────────────────
      - name: Check required skill files
        run: |
          echo "## 📋 Required File Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          SKILL_DIR="epistemic-arc-mapping"
          REQUIRED_FILES=(
            "$SKILL_DIR/SKILL.md"
            "$SKILL_DIR/README.md"
            "$SKILL_DIR/LICENSE"
          )

          ALL_PRESENT=true
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ \`$file\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ \`$file\` **MISSING**" >> $GITHUB_STEP_SUMMARY
              ALL_PRESENT=false
            fi
          done

          # Check resources directory exists
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources Directory" >> $GITHUB_STEP_SUMMARY
          if [ -d "$SKILL_DIR/resources" ]; then
            SUBSKILL_COUNT=$(find "$SKILL_DIR/resources" -name "*.md" -type f 2>/dev/null | wc -l)
            echo "- **Subskills found**: $SUBSKILL_COUNT" >> $GITHUB_STEP_SUMMARY
            if [ -n "$(find "$SKILL_DIR/resources" -name "*.md" -type f 2>/dev/null)" ]; then
              find "$SKILL_DIR/resources" -name "*.md" -type f 2>/dev/null | while read f; do
                echo "  - \`$f\`" >> $GITHUB_STEP_SUMMARY
              done
            fi
          else
            echo "⚠️  resources/ directory not found (optional for this skill)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$ALL_PRESENT" = true ]; then
            echo "✅ All required files present" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some required files are missing" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # ── Validate YAML frontmatter ───────────────────────────────
      - name: Validate SKILL.md frontmatter
        run: |
          echo "## 🔍 SKILL.md Frontmatter Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          SKILL_FILE="epistemic-arc-mapping/SKILL.md"

          # Check if file starts with ---
          if ! head -1 "$SKILL_FILE" | grep -q "^---$"; then
            echo "❌ **ERROR**: SKILL.md must start with \`---\` for YAML frontmatter" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Extract frontmatter (between first two --- markers)
          FRONTMATTER=$(awk '/^---$/{n++} n==1{print} n==2{exit}' "$SKILL_FILE" | tail -n +2)

          # Check for required fields
          echo "Checking required frontmatter fields..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if echo "$FRONTMATTER" | grep -q "^name:"; then
            NAME=$(echo "$FRONTMATTER" | grep "^name:" | sed 's/name: *//')
            echo "✅ \`name\`: $NAME" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  \`name\` field missing (will default to directory name)" >> $GITHUB_STEP_SUMMARY
          fi

          if echo "$FRONTMATTER" | grep -q "^description:"; then
            echo "✅ \`description\` field present" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **ERROR**: \`description\` field is required" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontmatter validation passed" >> $GITHUB_STEP_SUMMARY

      # ── Check file size (should be under 500 lines) ─────────────
      - name: Check SKILL.md size
        run: |
          echo "## 📏 SKILL.md Size Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          SKILL_FILE="epistemic-arc-mapping/SKILL.md"
          LINE_COUNT=$(wc -l < "$SKILL_FILE")
          FILE_SIZE=$(du -h "$SKILL_FILE" | cut -f1)

          echo "- **Lines**: $LINE_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $FILE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $LINE_COUNT -le 500 ]; then
            echo "✅ Under recommended 500-line limit" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Exceeds recommended 500-line limit (but acceptable for this skill)" >> $GITHUB_STEP_SUMMARY
            echo "_The epistemic arc mapping skill is complete in SKILL.md by design_" >> $GITHUB_STEP_SUMMARY
          fi

          # Also report subskill sizes if they exist
          if [ -d "epistemic-arc-mapping/resources" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Subskill Sizes" >> $GITHUB_STEP_SUMMARY
            if [ -n "$(find epistemic-arc-mapping/resources -name "*.md" -type f 2>/dev/null)" ]; then
              find epistemic-arc-mapping/resources -name "*.md" -type f 2>/dev/null | while read f; do
                echo "- \`$(basename $f)\`: $(wc -l < $f) lines" >> $GITHUB_STEP_SUMMARY
              done
            fi
          fi

      # ── Summary ─────────────────────────────────────────────────
      - name: Validation summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All validation checks passed. Skill is ready for packaging." >> $GITHUB_STEP_SUMMARY


  # ──────────────────────────────────────────────────────────────
  # JOB 2: build
  # Creates the .skill ZIP file with proper structure
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build .skill package
    runs-on: ubuntu-latest
    needs: validate

    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      skill_file: ${{ steps.package.outputs.skill_file }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Extract version from tag or use commit SHA ──────────────
      - name: Extract version
        id: extract_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tag release: v1.0.0 → 1.0.0
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            # Non-tag: use short commit SHA
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "## 📦 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA**: \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ── Package skill into ZIP ──────────────────────────────────
      - name: Package skill
        id: package
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          SKILL_FILE="epistemic-arc-mapping-${VERSION}.skill"

          echo "Packaging skill as $SKILL_FILE..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Create ZIP from skill directory
          cd epistemic-arc-mapping
          zip -r "../$SKILL_FILE" . \
            -x "*.git*" \
            -x "*.DS_Store" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x ".gitkeep"
          cd ..

          # Get file info
          FILE_SIZE=$(du -h "$SKILL_FILE" | cut -f1)
          FILE_COUNT=$(unzip -l "$SKILL_FILE" | tail -1 | awk '{print $2}')

          echo "skill_file=$SKILL_FILE" >> $GITHUB_OUTPUT

          echo "### 📊 Package Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Filename**: \`$SKILL_FILE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $FILE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Files**: $FILE_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📁 Contents" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          unzip -l "$SKILL_FILE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ── Upload artifact ─────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-package-${{ steps.extract_version.outputs.version }}
          path: ${{ steps.package.outputs.skill_file }}
          retention-days: 30

      - name: Build summary
        run: |
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Skill package created successfully and uploaded as artifact." >> $GITHUB_STEP_SUMMARY


  # ──────────────────────────────────────────────────────────────
  # JOB 3: release
  # Creates GitHub Release with .skill file (only on tags)
  # ──────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: skill-package-${{ needs.build.outputs.version }}

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          SKILL_FILE="${{ needs.build.outputs.skill_file }}"

          # Extract recent commit messages (for release notes)
          COMMITS=$(git log --pretty=format:"- %s (%h)" -10)

          # Create release notes
          cat > release_notes.md << EOF
          # Epistemic Arc Mapping Skill v${VERSION}

          A Claude skill for rigorous academic analysis — maps claims, epistemic foundations,
          and productive tensions in papers, policy documents, and scholarly arguments.
          Distinguishes truth-seeking scholarship from sophistic advocacy through systematic
          analysis of argumentative structure, evidence quality, and rhetorical patterns.

          ## 📦 Installation

          1. Download \`${SKILL_FILE}\`
          2. Unzip to your Claude skills directory:
             \`\`\`bash
             unzip ${SKILL_FILE} -d ~/.claude/skills/epistemic-arc-mapping/
             \`\`\`
          3. Use in Claude Web (primary) or Claude Code: \`/epistemic-arc-mapping\`

          ## 🎯 What's Included

          - **SKILL.md**: Complete methodology (~420 lines) — four-step arc analysis, epistemic strength indicators, sophistry detection matrix (7 categories), steel man test, output templates
          - **README.md**: Quick reference guide
          - **LICENSE**: CC BY-SA 4.0
          - **resources/**: Future specialized subskills (policy documents, book chapters, worked examples)

          ## 📋 Core Methodology

          **The Four Steps** (per argumentative arc):
          1. **Identify Core Claim** — Extract the load-bearing assertion
          2. **Assess Epistemic Strength** — Falsifiable? Transparent? Acknowledges uncertainty?
          3. **Identify Tensions to Probe** — Constructive questions about boundaries, alternatives, confounds
          4. **Note Sophistry Markers** (if present) — Systematic rhetorical patterns

          **The Master Diagnostic**: Steel Man Test — Can the author accurately represent and strengthen opposing arguments?

          ## 🏗️ Design Philosophy

          This skill embodies Architecture of Complexity principles: hierarchical decomposition
          (Paper → Arcs → Components → Markers), near-decomposability (each arc analyzed
          independently), and stable intermediate forms (arc-by-arc construction).

          ## 📄 License

          CC BY-SA 4.0 — Jérémie Lumbroso and Claude Sonnet 4.5

          **Origin**: The epistemic arc mapping methodology was invented spontaneously by
          Claude Web Sonnet 4.5 during analysis of an academic paper, then formalized
          by Jérémie Lumbroso as a Claude skill.

          ---

          ## Recent Changes

          ${COMMITS}

          ---

          **Authors**: Jérémie Lumbroso and Claude Sonnet 4.5
          **Created**: March 2026
          EOF

          echo "## 🚀 Release Notes Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```markdown' >> $GITHUB_STEP_SUMMARY
          cat release_notes.md | head -40 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ needs.build.outputs.skill_file }}
          body_path: release_notes.md
          name: Epistemic Arc Mapping Skill v${{ needs.build.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release **v${{ needs.build.outputs.version }}** created successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})" >> $GITHUB_STEP_SUMMARY
